[package]
name = "rojgar-scraper"
version = "0.1.0"
edition = "2021"
# Runs daily in GitHub Actions, so compile time and binary size matter: no async runtime,
# no OpenSSL, three sequential polite requests, one static binary.
rust-version = "1.80"

[dependencies]
# Blocking HTTP over rustls: no system OpenSSL, small dependency tree, simple retries.
ureq = { version = "3", features = ["json", "rustls"] }
# html5ever-based parser; CSS selectors come from its `Selector` API.
scraper = "0.29"
# Indian day-first dates plus Gujarati/Devanagari digit normalisation.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# robots.txt parsing. robotxt is actively maintained (2026) and supports crawl-delay and
# sitemap extensions; texting_robots has not been updated since 2023.
robotxt = "0.7"
# URL parsing/joining for relative hrefs.
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
