name: PDF Enrichment

# Official PDFs are the only place some notices state the qualification or age. This pass
# visits live notices that still miss a fact, so it is monthly rather than daily. Manual runs
# default to a dry run; the scheduled run writes.
on:
  schedule:
    - cron: '15 3 1 * *' # 03:15 UTC on the 1st = 08:45 AM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write to the database)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pdf-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    name: Backfill eligibility, pay and official links from notices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scraper-rs

      # Poppler extracts text, renders pages for OCR, and Tesseract reads scanned Gujarati
      # and English circulars. Without the Gujarati pack a scanned Gujarati notice yields
      # nothing, so it is installed explicitly rather than relying on a runner default.
      - name: Install Poppler and Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-guj

      - name: Unit tests
        working-directory: scraper-rs
        run: cargo test --locked

      - name: Clippy
        working-directory: scraper-rs
        run: cargo clippy --locked -- -D warnings

      - name: Backfill from PDFs
        working-directory: scraper-rs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cargo build --release --locked
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" = "true" ]; then
            ./target/release/rojgar-scraper --backfill-pdfs --dry-run
          else
            ./target/release/rojgar-scraper --backfill-pdfs --no-dry-run
          fi
