name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Jest
        run: npm test -- --ci

  # The gates that prove the real query path, the real UI and the axe budget. They run the
  # same scripts as a developer machine against the hosted project, so CI checks the same
  # database the app ships with. The scripts still support the local Docker stack when
  # SUPABASE_URL is unset (see SETUP.md).
  live-gates:
    name: Live data, web E2E & accessibility
    runs-on: ubuntu-latest
    needs: [app-checks]
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # The paid LLM path is verified on demand; CI keeps the contract checks free.
      SKIP_LLM: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Check hosted Supabase secrets
        run: |
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] || {
            echo "::error::Set SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY in repository secrets."
            exit 1
          }

      - name: Install the browser used by the E2E and axe gates
        run: |
          npm install -g agent-browser@0.43.0
          agent-browser install --with-deps

      - name: Live-data contract (PostgREST, RLS, pool, Edge auth)
        run: bash scripts/verify-live-data.sh

      - name: Web E2E against the hosted project
        run: bash scripts/e2e-web.sh

      - name: Four-tab axe audit
        run: bash scripts/a11y-audit.sh

  scraper-tests:
    name: Scraper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: python -m unittest discover -s scraper -p 'test_*.py'

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: [app-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Export web bundle
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/

  android-e2e:
    name: Native Android E2E (Maestro)
    runs-on: ubuntu-latest
    needs: [app-checks]
    timeout-minutes: 45
    # The emulator talks to the hosted project over the public internet, so the build embeds
    # the same public pair the app ships with. No local stack and no secrets in the APK.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Install maestro-runner
        run: |
          curl -fsSL https://open.devicelab.dev/install/maestro-runner | bash
          RUNNER="$(command -v maestro-runner || find "$HOME" /usr/local/bin -name maestro-runner -type f 2>/dev/null | head -1)"
          test -n "$RUNNER" || { echo "maestro-runner not found after install"; exit 1; }
          echo "$(dirname "$RUNNER")" >> "$GITHUB_PATH"

      # The emulator action passes each script line to `sh -c`, so this must stay one line
      # per command — a multi-line `|| { ... }` block is a syntax error there.
      # A release APK embeds the JS bundle; a debug APK would wait for Metro, which is not
      # running on the runner, and never render the app.
      - name: Run Android emulator and smoke flow
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro-runner test e2e/android/smoke.yaml; STATUS=$?; if [ $STATUS -ne 0 ]; then adb logcat -d | tail -200; exit $STATUS; fi

      - name: Upload Maestro report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: reports/
          if-no-files-found: ignore
