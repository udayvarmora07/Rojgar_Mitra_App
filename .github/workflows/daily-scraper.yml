name: Daily Job Scraper

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 6:00 AM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write to the database)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  # The Rust scraper is the production path: one static binary, no Python runtime, and the
  # same 105 advertisements from OJAS + GPSC + the aggregated Gujarat listing.
  scrape:
    name: Scrape jobs & sync to Supabase (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scraper-rs

      - name: Unit tests
        working-directory: scraper-rs
        run: cargo test --locked

      - name: Clippy
        working-directory: scraper-rs
        run: cargo clippy --locked -- -D warnings

      - name: Run scraper
        working-directory: scraper-rs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_REPORT_PATH: scrape_report.json
        run: |
          cargo build --release --locked
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" = "true" ]; then
            ./target/release/rojgar-scraper --dry-run
          else
            ./target/release/rojgar-scraper --no-dry-run
          fi

      - name: Upload scrape report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report-${{ github.run_number }}
          path: scraper-rs/scrape_report.json
          if-no-files-found: ignore
          retention-days: 14

  # Keeps the Python implementation verified against the same fixtures while it is still
  # maintained; the job can be deleted once nothing depends on it.
  python-parsers:
    name: Python parser tests (legacy parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s scraper -p 'test_*.py'
